
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms and Tables</title>
</head>

<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Fill in the form to register as a student.</p>
    </header>

    <hr>

    <!-- Student Registration Form -->
    <main>

        <section>
            <h2>Registration Form</h2>

            <form action="#" method="get">

                <!-- Name -->
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"
                    placeholder="Enter your full name" required>

                <br><br>

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your email" required>

                <br><br>

                <!-- Password -->
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                    placeholder="Enter password" required>

                <br><br>

                <!-- Age -->
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" max="100">

                <br><br>

                <!-- Date -->
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">

                <br><br>

                <!-- Gender -->
                <p>Gender:</p>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <br><br>

                <!-- Subjects -->
                <p>Select Your Subjects:</p>

                <input type="checkbox" id="html" name="subject" value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="subject" value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox" id="js" name="subject" value="JavaScript">
                <label for="js">JavaScript</label>

                <br><br>

                <!-- Message -->
                <label for="message">Your Message:</label>
                <br>
                <textarea id="message" name="message"
                    rows="4" cols="30"
                    placeholder="Write your message"></textarea>

                <br><br>

                <!-- Submit Button -->
                <button type="submit">Register</button>
                <button type="reset">Clear Form</button>

            </form>
        </section>

        <hr>

        <!-- Student Records Table -->
        <section>
            <h2>Student Records</h2>

            <table border="1">

                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>

                <tr>
                    <td>01</td>
                    <td>Tahira</td>
                    <td>HTML</td>
                    <td>90</td>
                </tr>

                <tr>
                    <td>02</td>
                    <td>Khola</td>
                    <td>CSS</td>
                    <td>85</td>
                </tr>

                <tr>
                    <td>03</td>
                    <td>Saad</td>
                    <td>JavaScript</td>
                    <td>88</td>
                </tr>

            </table>
        </section>

    </main>

    <hr>

    <footer>
        <p>© 2026 Student Registration Website</p>
    </footer>

</body>
</html>
